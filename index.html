<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Feedback</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f7ff, #e9f0fa);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
        }
        h1 {
            color: #1e3a5f;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .sub {
            color: #475569;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: #0f172a;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            font-size: 14px;
            background: white;
        }
        textarea {
            resize: vertical;
        }
        .rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 10px;
        }
        .rating input {
            display: none;
        }
        .rating label {
            font-size: 32px;
            color: #cbd5e1;
            cursor: pointer;
            transition: 0.1s;
        }
        .rating input:checked ~ label,
        .rating label:hover,
        .rating label:hover ~ label {
            color: #fbbf24;
        }
        button {
            background: #1e3a5f;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        button:hover {
            background: #0f2b44;
            transform: translateY(-2px);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #15803d;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }
        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>✍️ Kirim Feedback</h1>
    <div class="sub">Masukan Anda akan dikirim ke admin (tidak ditampilkan di sini)</div>

    <form id="feedbackForm">
        <div class="form-group">
            <label>👤 Nama (opsional)</label>
            <input type="text" id="name" placeholder="Bisa dikosongkan">
        </div>

        <div class="form-group">
            <label>⭐ Rating</label>
            <div class="rating">
                <input type="radio" name="rating" value="5" id="star5"><label for="star5">★</label>
                <input type="radio" name="rating" value="4" id="star4"><label for="star4">★</label>
                <input type="radio" name="rating" value="3" id="star3"><label for="star3">★</label>
                <input type="radio" name="rating" value="2" id="star2"><label for="star2">★</label>
                <input type="radio" name="rating" value="1" id="star1"><label for="star1">★</label>
            </div>
        </div>

        <div class="form-group">
            <label>📂 Kategori</label>
            <select id="category">
                <option value="Saran">💡 Saran</option>
                <option value="Kritik">⚠️ Kritik</option>
                <option value="Pujian">🎉 Pujian</option>
                <option value="Laporan">🐛 Laporan Masalah</option>
                <option value="Lainnya">📌 Lainnya</option>
            </select>
        </div>

        <div class="form-group">
            <label>💬 Pesan</label>
            <textarea id="message" rows="4" placeholder="Tulis feedback Anda..." required></textarea>
        </div>

        <button type="submit">📨 Kirim Feedback</button>
    </form>
    <div class="info">
        🔒 Feedback Anda tersimpan secara rahasia
    </div>
</div>

<div id="toastMsg" class="toast">✅ Feedback terkirim!</div>

<script>
    const form = document.getElementById('feedbackForm');
    const toast = document.getElementById('toastMsg');

    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.style.background = isError ? '#b91c1c' : '#15803d';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2500);
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        // Ambil rating
        let ratingValue = null;
        const radios = document.querySelectorAll('input[name="rating"]');
        for (let r of radios) {
            if (r.checked) { ratingValue = r.value; break; }
        }

        const message = document.getElementById('message').value.trim();
        if (!message) {
            showToast('❌ Pesan tidak boleh kosong', true);
            return;
        }
        if (!ratingValue) {
            showToast('⭐ Pilih rating bintang dulu', true);
            return;
        }

        const name = document.getElementById('name').value.trim() || 'Anonim';
        const category = document.getElementById('category').value;

        const newFeedback = {
            id: Date.now(),
            timestamp: new Date().toLocaleString('id-ID'),
            nama: name,
            rating: parseInt(ratingValue),
            kategori: category,
            pesan: message
        };

        // Simpan ke localStorage
        let allFeedbacks = JSON.parse(localStorage.getItem('feedbackList')) || [];
        allFeedbacks.push(newFeedback);
        localStorage.setItem('feedbackList', JSON.stringify(allFeedbacks));

        // Reset form
        document.getElementById('message').value = '';
        radios.forEach(r => r.checked = false);
        document.getElementById('name').value = '';
        document.getElementById('category').value = 'Saran';

        showToast('✅ Feedback terkirim! Terima kasih 🙏');
    });
</script>
</body>
</html>
